name: Test

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
      - '*.svg'
      - '.editorconfig'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          # server 包 -short 插桩峰值贴 600s（CI 慢机已两次撞线 panic，
          # 本地负载下亦实测 600.7s——见 todo 2026-09-27 运维坑），对齐
          # 下方 race 步骤放宽到 900s
          go test -short ./... -coverprofile=coverage.out -covermode=atomic -timeout 900s

      - name: Check coverage threshold
        run: |
          # 块级校验：未覆盖语句块必须登记 tool/known_uncoverable.txt 并附理由，
          # 有效覆盖 100%。取代原「total 恒 100%」grep——探针 main() 场景编排、
          # 真机命令默认闭包、死防御等无法进程内确定性覆盖，属结构性边界须登记豁免
          bash tool/coverage_check.sh coverage.out

      - name: Run tests with race detector
        run: |
          # race 插桩比覆盖步更慢：server 包本地实测 1004s（2026-10-13，
          # P2 ② stack webhook/follow 用例入账后），900s 已不够，放宽到 1500s
          go test -race -short ./... -timeout 1500s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Run web unit tests with coverage gate
        run: |
          cd web
          pnpm install --frozen-lockfile
          bash tool/coverage_check.sh
