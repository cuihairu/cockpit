name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go vet (rdp tag)
        run: go vet -tags rdp ./...

      - name: Run tests with coverage
        run: |
          # server 包 -short 插桩峰值贴 600s（CI 慢机已两次撞线 panic，
          # 本地负载下亦实测 600.7s——见 todo 2026-09-27 运维坑），对齐
          # 下方 race 步骤放宽到 900s
          go test -short ./... -coverprofile=coverage.out -covermode=atomic -timeout 900s

      # RDP 桌面客户端（grdp）仅在 -tags rdp 构建编译；默认 stub 分支已在
      # 上一步覆盖，此处验证真实现分支可编译、测试全绿且覆盖率与默认构建
      # 同口径 100%（单独 profile，不混入上方的 coverage.out）
      - name: Run RDP-tagged tests with coverage
        run: go test -tags rdp -short ./internal/agent/rdp/ ./internal/agent/ -coverprofile=coverage-rdp.out -covermode=atomic -timeout 600s

      - name: Check RDP coverage threshold
        run: |
          # 必须锚定 ^total:——探针包有 totalOps 等含 "total" 的函数名，
          # 裸 grep 会把函数行混进 coverage 变量（多行值令 bc 语法错 →
          # (( )) 恒假 → 门禁在真实低于阈值时静默放行，2026-10-01 实锤）
          coverage=$(go tool cover -func=coverage-rdp.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "RDP coverage: ${coverage}%"
          if (( $(echo "$coverage < 100" | bc -l) )); then
            echo "Coverage ${coverage}% is below 100% threshold"
            echo '--- functions below 100% ---'
            go tool cover -func=coverage-rdp.out | awk '{gsub(/%/, "", $3)} $3 + 0 < 100 {print}' | head -50
            exit 1
          fi
          echo "Coverage ${coverage}% meets threshold"

      - name: Check coverage threshold
        run: |
          # 同上：锚定 ^total: 防 totalOps 类函数名误匹配（修复前 CI 日志
          # 曾出现 coverage 变量为 "0.0\n89.3" 两行 → bc 语法错 → 门禁假绿）
          coverage=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${coverage}%"
          if (( $(echo "$coverage < 100" | bc -l) )); then
            echo "Coverage ${coverage}% is below 100% threshold"
            echo '--- functions below 100% ---'
            go tool cover -func=coverage.out | awk '{gsub(/%/, "", $3)} $3 + 0 < 100 {print}' | head -50
            exit 1
          fi
          echo "Coverage ${coverage}% meets threshold"

      - name: Run tests with race detector
        run: go test -race -short ./... -timeout 900s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Run web unit tests with coverage gate
        run: |
          cd web
          pnpm install --frozen-lockfile
          bash tool/coverage_check.sh
