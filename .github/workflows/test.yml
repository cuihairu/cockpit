name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go vet (rdp tag)
        run: go vet -tags rdp ./...

      - name: Run tests with coverage
        run: |
          go test -short ./... -coverprofile=coverage.out -covermode=atomic -timeout 600s

      # RDP 桌面客户端（grdp）仅在 -tags rdp 构建编译；默认 stub 分支已在
      # 上一步覆盖，此处验证真实现分支可编译且测试全绿
      - name: Run RDP-tagged tests
        run: go test -tags rdp -short ./internal/agent/rdp/ ./internal/agent/ -timeout 600s

      - name: Check coverage threshold
        run: |
          coverage=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${coverage}%"
          if (( $(echo "$coverage < 100" | bc -l) )); then
            echo "Coverage ${coverage}% is below 100% threshold"
            echo '--- functions below 100% ---'
            go tool cover -func=coverage.out | awk '{gsub(/%/, "", $3)} $3 + 0 < 100 {print}' | head -50
            exit 1
          fi
          echo "Coverage ${coverage}% meets threshold"

      - name: Run tests with race detector
        run: go test -race -short ./... -timeout 900s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Run web unit tests with coverage gate
        run: |
          cd web
          pnpm install --frozen-lockfile
          bash tool/coverage_check.sh
