name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Download dependencies
        run: go mod download

      - name: Run go vet
        run: go vet ./...

      - name: Run go vet (rdp tag)
        run: go vet -tags rdp ./...

      - name: Run tests with coverage
        run: |
          # server 包 -short 插桩峰值贴 600s（CI 慢机已两次撞线 panic，
          # 本地负载下亦实测 600.7s——见 todo 2026-09-27 运维坑），对齐
          # 下方 race 步骤放宽到 900s
          go test -short ./... -coverprofile=coverage.out -covermode=atomic -timeout 900s

      # RDP 桌面客户端（grdp）仅在 -tags rdp 构建编译；默认 stub 分支已在
      # 上一步覆盖，此处验证真实现分支可编译、测试全绿且覆盖率与默认构建
      # 同口径 100%（单独 profile，不混入上方的 coverage.out）
      - name: Run RDP-tagged tests with coverage
        run: go test -tags rdp -short ./internal/agent/rdp/ ./internal/agent/ -coverprofile=coverage-rdp.out -covermode=atomic -timeout 600s

      - name: Check RDP coverage threshold
        run: |
          # 与全量同口径：未覆盖语句块必须登记 tool/known_uncoverable.txt
          # （块级校验，取代原 go tool cover -func 百分比取整的 ^total: grep；
          # 本 rdp 子集实测 0 未覆盖块）
          bash tool/coverage_check.sh coverage-rdp.out

      - name: Check coverage threshold
        run: |
          # 块级校验：未覆盖语句块必须登记 tool/known_uncoverable.txt 并附理由，
          # 有效覆盖 100%。取代原「total 恒 100%」grep——探针 main() 场景编排、
          # 真机命令默认闭包、死防御等无法进程内确定性覆盖，属结构性边界须登记豁免
          bash tool/coverage_check.sh coverage.out

      - name: Run tests with race detector
        run: go test -race -short ./... -timeout 900s

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Run web unit tests with coverage gate
        run: |
          cd web
          pnpm install --frozen-lockfile
          bash tool/coverage_check.sh
