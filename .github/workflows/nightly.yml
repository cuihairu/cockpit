name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24

jobs:
  check-activity:
    name: Check Recent Activity
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      last-commit-time: ${{ steps.check.outputs.last-commit-time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check last commit time
        id: check
        run: |
          # 获取最后一次提交的时间戳（Unix 时间）
          last_commit=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          # 计算 24 小时前的时间戳
          one_day_ago=$((current_time - 86400))

          echo "Last commit timestamp: $last_commit"
          echo "Current timestamp: $current_time"
          echo "24 hours ago: $one_day_ago"

          if [ "$last_commit" -ge "$one_day_ago" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "✅ Recent commits found, proceeding with nightly build"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⏭️ No commits in the last 24 hours, skipping nightly build"
          fi

          # 格式化最后提交时间供显示
          last_commit_time=$(git log -1 --format=%ci)
          echo "last-commit-time=$last_commit_time" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.target }})
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "1"
            ext: ""
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: ".exe"
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc sqlite3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite3

      - name: Download Go dependencies
        run: go mod download

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=$(date +%Y%m%d)" -o "dist/cockpit${{ matrix.ext }}" ./cmd/cockpit

      - name: Package binaries
        shell: bash
        run: |
          cd dist
          tar czf "cockpit-${{ matrix.target }}-nightly.tar.gz" "cockpit${{ matrix.ext }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-${{ matrix.target }}
          path: |
            dist/cockpit-${{ matrix.target }}-nightly.tar.gz
          retention-days: 7

  # agent 拆包后依赖闭包零 sqlite，全部目标在 ubuntu 交叉编译 CGO=0
  # 全静态（OpenWrt job 同理），不再占用 windows/macos 原生 runner；
  # 顺带补齐 linux-arm64 与 darwin-amd64。Windows 出 zip（平台惯例）。
  # install.sh / install.ps1 一键安装脚本按 `cockpit-agent-<goos>-<goarch>-nightly.*`
  # 命名拉取，新增目标须同步该命名与脚本支持矩阵。
  build-agent:
    name: Build Agent (${{ matrix.target }})
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: linux-arm
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build agent (pure static, CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$(date +%Y%m%d)" -o "dist/cockpit-agent${{ matrix.ext }}" ./cmd/cockpit-agent

      - name: Package agent (tar.gz / zip)
        run: |
          cd dist
          if [ -n "${{ matrix.ext }}" ]; then
            zip "cockpit-agent-${{ matrix.target }}-nightly.zip" "cockpit-agent${{ matrix.ext }}"
          else
            tar czf "cockpit-agent-${{ matrix.target }}-nightly.tar.gz" "cockpit-agent"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-agent-${{ matrix.target }}
          path: |
            dist/cockpit-agent-${{ matrix.target }}-nightly.*
          retention-days: 7

  build-openwrt:
    name: Build OpenWrt (${{ matrix.goarch }})
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: mipsle
            gomips: softfloat
            arch: mipsel
          - goarch: mips
            gomips: softfloat
            arch: mips
          - goarch: arm64
            gomips: ""
            arch: aarch64_generic
          - goarch: arm
            gomips: ""
            goarm: "7"
            arch: arm_cortex-a7_neon-vfpv4
          - goarch: amd64
            gomips: ""
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build agent (pure static, CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/cockpit-agent ./cmd/cockpit-agent

      - name: Package ipk + tar.gz
        run: |
          version="0.1.0-$(date +%Y%m%d)"
          scripts/package-ipk.sh dist/cockpit-agent "${{ matrix.arch }}" "$version" dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-agent-openwrt-${{ matrix.arch }}
          path: |
            dist/*.ipk
            dist/cockpit-agent-openwrt-${{ matrix.arch }}.tar.gz
          retention-days: 7

  # Windows 安装器（Inno Setup 6，windows-latest 镜像预装）：setup.exe +
  # SHA256 侧车进 nightly release；随后真 Windows 走查 安装→服务
  # Automatic+Running（开机自启）→exe 图标→开始菜单/桌面快捷方式→静默卸载
  # 全清，截图与图标抽样留档上传（BUGS.md B1 用户催办项的验收面）
  build-agent-installer:
    name: Build Agent Installer (windows)
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Build agent (windows-amd64, pure static)
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p stage dist
          go build -trimpath -ldflags="-s -w -X main.version=$(date +%Y%m%d)" \
            -o stage/cockpit-agent.exe ./cmd/cockpit-agent

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          # windows-latest 镜像预装 Inno Setup 6；缺失时明确报错不静默跳过
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "ISCC.exe not found: $iscc（runner 镜像缺 Inno Setup 6）"
            exit 1
          }
          $stageDir = Join-Path $PWD 'stage'
          if (-not (Test-Path (Join-Path $stageDir 'cockpit-agent.exe'))) {
            Write-Error "staging dir missing cockpit-agent.exe: $stageDir"
            exit 1
          }
          # 产物名 cockpit-agent-setup-nightly.exe 与 zip 资产的
          # cockpit-agent-<goos>-<goarch>-nightly.* 刻意错开（install.ps1
          # 按架构拉 zip 不会误取安装器）
          & $iscc `
            "/DAppVersion=nightly" `
            "/DStageDir=$stageDir" `
            "/O$PWD\dist" `
            'packaging\windows\agent.iss'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "ISCC failed with exit $LASTEXITCODE"
            exit 1
          }
          Get-ChildItem dist -Filter 'cockpit-agent-setup-*.exe' | Select-Object Name, Length

      - name: SHA256 checksum
        shell: pwsh
        run: |
          $exe = 'dist\cockpit-agent-setup-nightly.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  cockpit-agent-setup-nightly.exe" | Out-File -FilePath "$exe.sha256" -Encoding ascii
          Get-Content "$exe.sha256"

      - name: Walkthrough (install / icon / autostart / uninstall + screenshots)
        timeout-minutes: 12
        # Windows PowerShell 5.1（非 pwsh 7）：System.Drawing / System.Windows.Forms
        # （图标抽取 + 桌面截图）在 5.1 的 GAC 里确定可用
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD 'dist\cockpit-agent-setup-nightly.exe'
          $appDir = Join-Path $env:ProgramFiles 'Cockpit Agent'
          $exe = Join-Path $appDir 'cockpit-agent.exe'
          $server = 'wss://walkthrough.invalid/ws'

          # ① 静默安装（服务任务默认勾选 + /SERVER 给地址）；管理员 runner 无 UAC
          $p = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/SERVER=$server" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "installer exit $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path $exe)) { Write-Error "not installed: $exe"; exit 1 }
          Write-Host "installed: $exe"

          # ② 开机自启：服务已注册 + Automatic + 轮询至 Running
          $svc = Get-Service -Name 'CockpitAgent' -ErrorAction SilentlyContinue
          if (-not $svc) { Write-Error 'service CockpitAgent not registered'; exit 1 }
          if ($svc.StartType -ne 'Automatic') { Write-Error "StartType=$($svc.StartType), want Automatic"; exit 1 }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and $svc.Status -ne 'Running') {
            Start-Sleep -Milliseconds 500
            $svc.Refresh()
          }
          if ($svc.Status -ne 'Running') { Write-Error "service status=$($svc.Status)"; exit 1 }
          Write-Host 'service: Automatic + Running'
          & $exe service status

          # ③ 图标：从 exe 资源段抽关联图标（RT_GROUP_ICON 落 PE 的实证）
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if (-not $icon) { Write-Error 'ExtractAssociatedIcon returned null'; exit 1 }
          $icon.ToBitmap().Save((Join-Path $PWD 'walkthrough-icon.png'), [System.Drawing.Imaging.ImageFormat]::Png)
          Write-Host 'icon extracted to walkthrough-icon.png'

          # ④ 快捷方式（开始菜单 + 桌面）
          $menuLnk = Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'Cockpit Agent\Cockpit Agent.lnk'
          $deskLnk = Join-Path ([Environment]::GetFolderPath('CommonDesktopDirectory')) 'Cockpit Agent.lnk'
          if (-not (Test-Path $menuLnk)) { Write-Error "start menu shortcut missing: $menuLnk"; exit 1 }
          if (-not (Test-Path $deskLnk)) { Write-Error "desktop shortcut missing: $deskLnk"; exit 1 }
          Write-Host 'shortcuts: start menu + desktop OK'

          # ⑤ 桌面截图留档（CopyFromScreen；失败不阻塞——前三步断言是硬证据）
          try {
            Add-Type -AssemblyName System.Windows.Forms
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.X, $b.Y, 0, 0, $bmp.Size)
            $bmp.Save((Join-Path $PWD 'walkthrough-desktop.png'), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
            Write-Host 'screenshot saved to walkthrough-desktop.png'
          } catch {
            Write-Warning "screenshot skipped: $_"
          }

          # ⑥ 静默卸载 → 服务/文件/快捷方式全清
          $unins = Join-Path $appDir 'unins000.exe'
          if (-not (Test-Path $unins)) { Write-Error "unins000.exe missing"; exit 1 }
          $u = Start-Process -FilePath $unins -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($u.ExitCode -ne 0) { Write-Error "uninstaller exit $($u.ExitCode)"; exit 1 }
          if (Test-Path $exe) { Write-Error "uninstall left behind: $exe"; exit 1 }
          if (Get-Service -Name 'CockpitAgent' -ErrorAction SilentlyContinue) { Write-Error 'service still registered after uninstall'; exit 1 }
          if (Test-Path $menuLnk) { Write-Error 'start menu shortcut left behind'; exit 1 }
          if (Test-Path $deskLnk) { Write-Error 'desktop shortcut left behind'; exit 1 }
          Write-Host 'WALKTHROUGH_OK: install -> autostart service -> icon -> shortcuts -> uninstall clean'

          # 证据并入 dist/：upload-artifact 以全部路径的公共祖先做归档根，
          # 若混用仓库根路径（walkthrough-*.png 在根）→ 归档带 dist/ 前缀，
          # Release 下载后落成 dist/dist/…，其 glob 不中直接挂（首跑实挂）
          Get-ChildItem walkthrough-*.png -ErrorAction SilentlyContinue |
            Move-Item -Destination dist -Force

      - name: Upload installer + walkthrough evidence
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-agent-installer
          path: |
            dist/cockpit-agent-setup-nightly.exe
            dist/cockpit-agent-setup-nightly.exe.sha256
            dist/walkthrough-icon.png
            dist/walkthrough-desktop.png
          retention-days: 7
          if-no-files-found: error

  build-web:
    name: Build Web
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Build Web
        working-directory: web
        run: |
          pnpm install
          pnpm run build

      - name: Package Web
        run: tar czf cockpit-web-nightly.tar.gz -C web/dist .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-web
          path: cockpit-web-nightly.tar.gz
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check-activity, build, build-agent, build-agent-installer, build-openwrt, build-web]
    if: needs.check-activity.outputs.should-build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 如果 release 已存在则删除（保留 tag）
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag=false
          fi

          DATE=$(date +%Y-%m-%d)

          gh release create nightly \
            --title "Nightly $DATE" \
            --latest=false \
            --notes "Automated nightly build ($DATE).

          ## Downloads
          | File | Platform | Arch |
          |------|----------|------|
          | \`cockpit-linux-amd64-nightly.tar.gz\` | Linux | x86_64 |
          | \`cockpit-windows-amd64-nightly.tar.gz\` | Windows | x86_64 |
          | \`cockpit-darwin-arm64-nightly.tar.gz\` | macOS | Apple Silicon |
          | \`cockpit-agent-*-nightly.tar.gz\` | Agent (纯静态) | linux amd64/arm64/armv7 · darwin amd64/arm64 |
          | \`cockpit-agent-windows-*-nightly.zip\` | Windows Agent (纯静态) | x86_64 · ARM64 |
          | \`cockpit-agent-setup-nightly.exe\` (+\`.sha256\`) | Windows Agent 安装器 | x86_64 · 装目录/快捷方式/服务化开机自启/卸载器 |
          | \`cockpit-agent_*.ipk / cockpit-agent-openwrt-*.tar.gz\` | OpenWrt Agent | mipsel/mips/aarch64_generic/arm_cortex-a7/x86_64 |
          | \`cockpit-web-nightly.tar.gz\` | Web UI | cross-platform |" \
            dist/cockpit-linux-amd64-nightly.tar.gz \
            dist/cockpit-windows-amd64-nightly.tar.gz \
            dist/cockpit-darwin-arm64-nightly.tar.gz \
            dist/cockpit-agent-*-nightly.tar.gz \
            dist/cockpit-agent-*-nightly.zip \
            dist/cockpit-agent-setup-nightly.exe \
            dist/cockpit-agent-setup-nightly.exe.sha256 \
            dist/cockpit-agent_*.ipk \
            dist/cockpit-agent-openwrt-*.tar.gz \
            dist/cockpit-web-nightly.tar.gz
