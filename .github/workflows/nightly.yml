name: Nightly Build

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: 24

jobs:
  check-activity:
    name: Check Recent Activity
    runs-on: ubuntu-latest
    outputs:
      should-build: ${{ steps.check.outputs.should-build }}
      last-commit-time: ${{ steps.check.outputs.last-commit-time }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check last commit time
        id: check
        run: |
          # 获取最后一次提交的时间戳（Unix 时间）
          last_commit=$(git log -1 --format=%ct)
          current_time=$(date +%s)
          # 计算 24 小时前的时间戳
          one_day_ago=$((current_time - 86400))

          echo "Last commit timestamp: $last_commit"
          echo "Current timestamp: $current_time"
          echo "24 hours ago: $one_day_ago"

          if [ "$last_commit" -ge "$one_day_ago" ]; then
            echo "should-build=true" >> $GITHUB_OUTPUT
            echo "✅ Recent commits found, proceeding with nightly build"
          else
            echo "should-build=false" >> $GITHUB_OUTPUT
            echo "⏭️ No commits in the last 24 hours, skipping nightly build"
          fi

          # 格式化最后提交时间供显示
          last_commit_time=$(git log -1 --format=%ci)
          echo "last-commit-time=$last_commit_time" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.target }})
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo: "1"
            ext: ""
          - target: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: ".exe"
          - target: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc sqlite3

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sqlite3

      - name: Download Go dependencies
        run: go mod download

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=$(date +%Y%m%d)" -o "dist/cockpit${{ matrix.ext }}" ./cmd/cockpit

      - name: Package binaries
        shell: bash
        run: |
          cd dist
          tar czf "cockpit-${{ matrix.target }}-nightly.tar.gz" "cockpit${{ matrix.ext }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-${{ matrix.target }}
          path: |
            dist/cockpit-${{ matrix.target }}-nightly.tar.gz
          retention-days: 7

  # agent 拆包后依赖闭包零 sqlite，全部目标在 ubuntu 交叉编译 CGO=0
  # 全静态（OpenWrt job 同理），不再占用 windows/macos 原生 runner；
  # 顺带补齐 linux-arm64 与 darwin-amd64。Windows 出 zip（平台惯例）。
  build-agent:
    name: Build Agent (${{ matrix.target }})
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - target: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - target: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build agent (pure static, CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=$(date +%Y%m%d)" -o "dist/cockpit-agent${{ matrix.ext }}" ./cmd/cockpit-agent

      - name: Package agent (tar.gz / zip)
        run: |
          cd dist
          if [ -n "${{ matrix.ext }}" ]; then
            zip "cockpit-agent-${{ matrix.target }}-nightly.zip" "cockpit-agent${{ matrix.ext }}"
          else
            tar czf "cockpit-agent-${{ matrix.target }}-nightly.tar.gz" "cockpit-agent"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-agent-${{ matrix.target }}
          path: |
            dist/cockpit-agent-${{ matrix.target }}-nightly.*
          retention-days: 7

  build-openwrt:
    name: Build OpenWrt (${{ matrix.goarch }})
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: mipsle
            gomips: softfloat
            arch: mipsel
          - goarch: mips
            gomips: softfloat
            arch: mips
          - goarch: arm64
            gomips: ""
            arch: aarch64_generic
          - goarch: arm
            gomips: ""
            goarm: "7"
            arch: arm_cortex-a7_neon-vfpv4
          - goarch: amd64
            gomips: ""
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Build agent (pure static, CGO off)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: ${{ matrix.gomips }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/cockpit-agent ./cmd/cockpit-agent

      - name: Package ipk + tar.gz
        run: |
          version="0.1.0-$(date +%Y%m%d)"
          scripts/package-ipk.sh dist/cockpit-agent "${{ matrix.arch }}" "$version" dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-agent-openwrt-${{ matrix.arch }}
          path: |
            dist/*.ipk
            dist/cockpit-agent-openwrt-${{ matrix.arch }}.tar.gz
          retention-days: 7

  build-web:
    name: Build Web
    needs: check-activity
    if: needs.check-activity.outputs.should-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '${{ env.NODE_VERSION }}'

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Build Web
        working-directory: web
        run: |
          pnpm install
          pnpm run build

      - name: Package Web
        run: tar czf cockpit-web-nightly.tar.gz -C web/dist .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: cockpit-web
          path: cockpit-web-nightly.tar.gz
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [check-activity, build, build-agent, build-openwrt, build-web]
    if: needs.check-activity.outputs.should-build == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Update nightly tag
        run: |
          git tag -f nightly
          git push -f origin nightly

      - name: Update nightly release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 如果 release 已存在则删除（保留 tag）
          if gh release view nightly > /dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag=false
          fi

          DATE=$(date +%Y-%m-%d)

          gh release create nightly \
            --title "Nightly $DATE" \
            --latest=false \
            --notes "Automated nightly build ($DATE).

          ## Downloads
          | File | Platform | Arch |
          |------|----------|------|
          | \`cockpit-linux-amd64-nightly.tar.gz\` | Linux | x86_64 |
          | \`cockpit-windows-amd64-nightly.tar.gz\` | Windows | x86_64 |
          | \`cockpit-darwin-arm64-nightly.tar.gz\` | macOS | Apple Silicon |
          | \`cockpit-agent-*-nightly.tar.gz\` | Agent (纯静态) | linux amd64/arm64 · darwin amd64/arm64 |
          | \`cockpit-agent-windows-amd64-nightly.zip\` | Windows Agent (纯静态) | x86_64 |
          | \`cockpit-agent_*.ipk / cockpit-agent-openwrt-*.tar.gz\` | OpenWrt Agent | mipsel/mips/aarch64_generic/arm_cortex-a7/x86_64 |
          | \`cockpit-web-nightly.tar.gz\` | Web UI | cross-platform |" \
            dist/cockpit-linux-amd64-nightly.tar.gz \
            dist/cockpit-windows-amd64-nightly.tar.gz \
            dist/cockpit-darwin-arm64-nightly.tar.gz \
            dist/cockpit-agent-*-nightly.tar.gz \
            dist/cockpit-agent-*-nightly.zip \
            dist/cockpit-agent_*.ipk \
            dist/cockpit-agent-openwrt-*.tar.gz \
            dist/cockpit-web-nightly.tar.gz
