name: Deploy

# 私有部署：在自托管 runner（pve-cockpit，label deployer）上以 docker compose
# 构建并启动服务。首次部署自动生成 ADMIN_PASSWORD/JWT_SECRET/TOTP_ENCRYPTION_KEY
# 并持久化在 runner 的 ~/.cockpit-deploy.env（600），后续部署复用同一组凭据，
# 保证数据卷中已初始化的账号与 JWT 会话不因重新部署而失效。

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "部署的分支/commit/tag（默认 main）"
        default: main
      mode:
        description: "deploy = 部署 cockpit；recover-clickhouse = 恢复误删的 croupier-clickhouse"
        default: deploy
        type: choice
        options:
          - deploy
          - recover-clickhouse
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  recover-clickhouse:
    if: inputs.mode == 'recover-clickhouse'
    name: Recover croupier-clickhouse
    runs-on: [self-hosted, deployer]
    timeout-minutes: 10
    steps:
      - name: Locate compose project
        id: locate
        run: |
          set -euo pipefail
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo '--- clickhouse/croupier 相关卷与网络 ---'
          # 容器已删但数据卷/网络仍在（rm 不删卷）；compose 写入的 label
          # 记录着项目目录，据此精准定位，不依赖目录名猜测
          dir=""
          for name in $(docker volume ls --format '{{.Name}}' | grep -iE 'clickhouse|croupier' || true); do
            d=$(docker volume inspect "$name" --format '{{index .Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null || true)
            if [ -n "$d" ]; then echo "volume $name → $d"; dir="$d"; fi
          done
          if [ -z "$dir" ]; then
            for name in $(docker network ls --format '{{.Name}}' | grep -iE 'clickhouse|croupier' || true); do
              d=$(docker network inspect "$name" --format '{{index .Labels "com.docker.compose.project.working_dir"}}' 2>/dev/null || true)
              if [ -n "$d" ]; then echo "network $name → $d"; dir="$d"; fi
            done
          fi
          if [ -z "$dir" ]; then
            echo '::warning::卷/网络 label 未定位到项目目录，回退 find + compose 校验'
            # 名字含 croupier 的目录里，只有「compose 文件中定义了
            # clickhouse 服务」的才是部署目录（源码/构建目录会误命中名字）
            for d in $(for root in /data /opt /srv /home /root; do
                find "$root" -maxdepth 4 -type d -iname '*croupier*' 2>/dev/null || true
              done | sort -u); do
              for f in "$d"/docker-compose.y*ml "$d"/compose.y*ml; do
                if [ -f "$f" ] && grep -qiE 'clickhouse' "$f"; then
                  echo "候选命中: $f"
                  if [ -z "$dir" ]; then dir="$d"; fi
                fi
              done
            done
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Coordinate ports
        run: |
          set -euo pipefail
          dir="${{ steps.locate.outputs.dir }}"
          cd "$dir"
          echo '--- clickhouse 端口配置 ---'
          grep -nE 'ports:|9[0-9]{3}:[0-9]{3}' docker-compose.yml | head -10 || true
          # clickhouse native 端口 9000 与 cockpit HTTP 端口 9000 结构性冲突：
          # 宿主 9000 归 cockpit（tunnel 回源），clickhouse 宿主侧动态挑空闲
          # 端口（e2e-clickhouse 长期占用 19000——写死的"安全端口"未必空闲），
          # 容器内仍 9000（croupier 内部走 docker 网络，不受影响）。只看
          # compose 文件内容，不看当前谁占 9000——cockpit 停机时 9000 空闲
          # 会误判"无冲突"漏改（曾因此恢复后 clickhouse 占住 9000，cockpit
          # 重启绑不上端口挂掉，公网 502）。改前备份。
          host_port=""
          for p in 29000 29001 29002 29190; do
            if [ -z "$(docker ps -q --filter publish=$p)" ]; then host_port=$p; break; fi
          done
          if [ -z "$host_port" ]; then
            echo "::error::候选宿主端口 29000/29001/29002/29190 均被占用，请人工分配"
            exit 1
          fi
          # 幂等守卫：19000:9000 含 9000:9000 子串、published:
          # 19000 匹配 .?9000，守卫防重复执行二次改写
          if grep -q '9000:9000' docker-compose.yml && ! grep -q '19000:9000' docker-compose.yml; then
            cp docker-compose.yml docker-compose.yml.bak-pre-recover
            sed -i 's/9000:9000/19000:9000/g' docker-compose.yml
            echo "短语法改写：9000:9000 → 19000:9000（原文件备份为 docker-compose.yml.bak-pre-recover）"
            grep -n '19000:9000' docker-compose.yml
          elif grep -Eq 'published:[[:space:]]*.?9000' docker-compose.yml && ! grep -Eq 'published:[[:space:]]*.?19000' docker-compose.yml; then
            cp docker-compose.yml docker-compose.yml.bak-pre-recover
            sed -i -E 's/(published:[[:space:]]*.?9000)([^0-9]|$)/\119000\2/' docker-compose.yml
            echo "长语法改写：published: 9000 → published: 19000（原文件备份为 docker-compose.yml.bak-pre-recover）"
            grep -nE 'published:[[:space:]]*.?19000' docker-compose.yml
          elif grep -qE '\$\{CLICKHOUSE_NATIVE_PORT:-9000\}' docker-compose.yml; then
            # 宿主侧走 .env 变量（实测 croupier compose 写法）：不动
            # compose 文件，写 .env 让 up 时生效
            if [ -f .env ] && grep -q '^CLICKHOUSE_NATIVE_PORT=' .env; then
              sed -i "s/^CLICKHOUSE_NATIVE_PORT=.*/CLICKHOUSE_NATIVE_PORT=$host_port/" .env
            else
              if [ -f .env ] && [ -n "$(tail -c 1 .env 2>/dev/null || true)" ]; then
                echo >> .env
              fi
              echo "CLICKHOUSE_NATIVE_PORT=$host_port" >> .env
            fi
            echo "已设置 .env → CLICKHOUSE_NATIVE_PORT=$host_port（宿主侧让出 9000）"
            grep -n 'CLICKHOUSE_NATIVE_PORT' .env
          else
            env_port=$(grep -oE '^CLICKHOUSE_NATIVE_PORT=[0-9]+' .env 2>/dev/null | tail -1 | cut -d= -f2)
            if grep -Eq '19000:9000|published:[[:space:]]*.?19000' docker-compose.yml \
               || { [ -n "$env_port" ] && [ "$env_port" != "9000" ]; }; then
              echo "已协调（宿主侧非 9000），无需改写"
            else
              echo '::warning::compose 中未识别到 9000 端口写法（短/长语法、.env 变量均无），请人工核对端口配置'
            fi
          fi

      - name: Up
        run: |
          set -euo pipefail
          dir="${{ steps.locate.outputs.dir }}"
          compose_file=""
          if [ -n "$dir" ]; then
            # 逐个检查：glob 未匹配时字面量会让 ls 整体报错，不能一次 ls 两种模式
            for f in "$dir"/docker-compose.y*ml "$dir"/compose.y*ml; do
              if [ -f "$f" ]; then compose_file="$f"; break; fi
            done
          fi
          if [ -n "$compose_file" ]; then
            echo "使用 compose 文件: $compose_file"
            cd "$dir"
            docker compose up -d
            sleep 5
            docker compose ps
            echo '--- croupier-clickhouse 状态 ---'
            docker compose ps clickhouse || true
          else
            echo "::error::未定位到 croupier compose 项目目录（数据卷完好，需手工恢复）"
            exit 1
          fi

  deploy:
    if: inputs.mode != 'recover-clickhouse'
    name: Deploy (self-hosted)
    runs-on: [self-hosted, deployer]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Prepare deploy env
        run: |
          set -euo pipefail
          if [ -f "$HOME/.cockpit-deploy.env" ]; then
            cp "$HOME/.cockpit-deploy.env" .env
            echo "复用 runner 本地已有部署凭据"
          else
            {
              echo "ADMIN_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 20)"
              echo "JWT_SECRET=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 48)"
              echo "TOTP_ENCRYPTION_KEY=$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 48)"
              echo "PRODUCTION=true"
              echo "TZ=Asia/Shanghai"
            } > .env
            chmod 600 .env
            cp .env "$HOME/.cockpit-deploy.env"
            chmod 600 "$HOME/.cockpit-deploy.env"
            echo "首次部署：已生成强随机凭据并持久化到 runner 本地"
          fi

      - name: Build image
        run: |
          set -euo pipefail
          docker compose build --pull

      - name: Take over old deployment
        run: |
          set -euo pipefail
          docker ps -a --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          echo '--- 占用 9000 的容器 ---'
          docker ps --filter publish=9000 --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
          # 同 compose project 的旧容器
          docker compose down --remove-orphans 2>/dev/null || true
          # 白名单接管：只动两类占 9000 的容器——
          # ① 本项目（compose project=cockpit 或镜像 cockpit:local）残留：移除
          # ② croupier-clickhouse（native 端口同为 9000，历史曾误删）：自动
          #    协调——宿主侧让出 9000 改 19000，数据卷不动，容器重建
          # 其他项目的容器一律不碰，报错要求人工处理
          for c in $(docker ps -aq --filter publish=9000); do
            img=$(docker inspect -f '{{.Config.Image}}' "$c")
            proj=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$c")
            name=$(docker inspect -f '{{.Name}}' "$c" | sed 's#^/##')
            if [ "$proj" = "cockpit" ] || [ "$img" = "cockpit:local" ]; then
              echo "移除本项目占 9000 的旧容器: $name"
              docker rm -f "$c"
            elif [ "$name" = "croupier-clickhouse" ]; then
              dir=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$c")
              svc=$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$c")
              echo "croupier-clickhouse 占 9000 → 自动协调宿主端口（项目目录 $dir，服务 $svc）"
              if [ -z "$dir" ] || [ ! -d "$dir" ]; then
                echo "::error::无法定位 croupier-clickhouse 的 compose 项目目录，请人工改端口"; exit 1
              fi
              compose_file=""
              for f in "$dir"/docker-compose.y*ml "$dir"/compose.y*ml; do
                if [ -f "$f" ]; then compose_file="$f"; break; fi
              done
              if [ -z "$compose_file" ]; then
                echo "::error::$dir 下未找到 compose 文件，请人工改端口"; exit 1
              fi
              cp "$compose_file" "$compose_file.bak-port-coordinate"
              # 端口写法不确定：短语法（9000:9000）、长语法（published: 9000）、
              # .env 变量（${CLICKHOUSE_NATIVE_PORT:-9000}）各识别一种。宿主侧
              # 目标端口动态挑选（e2e-clickhouse 长期占用 19000 的教训——写死
              # 的"安全端口"未必空闲），候选依次探测取第一个空闲的
              host_port=""
              for p in 29000 29001 29002 29190; do
                if [ -z "$(docker ps -q --filter publish=$p)" ]; then host_port=$p; break; fi
              done
              if [ -z "$host_port" ]; then
                echo "::error::候选宿主端口 29000/29001/29002/29190 均被占用，请人工分配"
                docker ps --format '{{.Names}}\t{{.Ports}}' | grep -E '29[0-9]{3}' || true
                exit 1
              fi
              if grep -q '9000:9000' "$compose_file" && ! grep -q '19000:9000' "$compose_file"; then
                sed -i 's/9000:9000/19000:9000/g' "$compose_file"
                echo "短语法改写：9000:9000 → 19000:9000"
                grep -n '19000:9000' "$compose_file" || true
              elif grep -Eq 'published:[[:space:]]*.?9000' "$compose_file" && ! grep -Eq 'published:[[:space:]]*.?19000' "$compose_file"; then
                sed -i -E 's/(published:[[:space:]]*.?9000)([^0-9]|$)/\119000\2/' "$compose_file"
                echo "长语法改写：published: 9000 → published: 19000"
                grep -nE 'published:[[:space:]]*.?19000' "$compose_file" || true
              elif grep -qE '\$\{CLICKHOUSE_NATIVE_PORT:-9000\}' "$compose_file"; then
                # 实测 croupier compose 写法：宿主侧走 .env 变量（默认 9000）。
                # 不动 compose 文件，写 .env 让 up 时生效——compose 读项目
                # 目录下的 .env，幂等且保留 croupier 的参数化设计
                if [ -f "$dir/.env" ] && grep -q '^CLICKHOUSE_NATIVE_PORT=' "$dir/.env"; then
                  sed -i "s/^CLICKHOUSE_NATIVE_PORT=.*/CLICKHOUSE_NATIVE_PORT=$host_port/" "$dir/.env"
                else
                  # 先补尾换行再追加：无尾换行的 .env 会把新行粘上上一行
                  if [ -f "$dir/.env" ] && [ -n "$(tail -c 1 "$dir/.env" 2>/dev/null || true)" ]; then
                    echo >> "$dir/.env"
                  fi
                  echo "CLICKHOUSE_NATIVE_PORT=$host_port" >> "$dir/.env"
                fi
                echo "已设置 $dir/.env → CLICKHOUSE_NATIVE_PORT=$host_port（宿主侧让出 9000）"
                grep -n 'CLICKHOUSE_NATIVE_PORT' "$dir/.env"
              fi
              env_port=$(grep -oE '^CLICKHOUSE_NATIVE_PORT=[0-9]+' "$dir/.env" 2>/dev/null | tail -1 | cut -d= -f2)
              if ! grep -q '19000:9000' "$compose_file" \
                 && ! grep -Eq 'published:[[:space:]]*.?19000' "$compose_file" \
                 && { [ -z "$env_port" ] || [ "$env_port" = "9000" ]; }; then
                echo "::error::自动改写未生效，端口写法见下（人工修改后重跑 deploy）："
                grep -nH -B 2 -A 3 '9000' "$compose_file" "$dir"/.env 2>/dev/null | head -60
                exit 1
              fi
              docker compose -f "$compose_file" up -d "$svc"
              echo '已重建 croupier-clickhouse（数据卷保留）'
            else
              echo "::error::端口 9000 被非本项目容器占用: $(docker ps -a --filter id=$c --format '{{.Names}} ({{.Image}})')。不自动删除——请人工处理"
              exit 1
            fi
          done
          # 协调/移除后宿主 9000 必须已让出（后续 Up 要绑它）
          left=$(docker ps -q --filter publish=9000 | wc -l)
          if [ "$left" -gt 0 ]; then
            echo "::error::处理后 9000 仍被占用:"; docker ps --filter publish=9000 --format '{{.Names}} ({{.Image}})'
            exit 1
          fi
          echo '宿主 9000 已让出'

      - name: Up
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 120

      - name: Smoke check (local)
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS -m 5 http://127.0.0.1:${COCKPIT_HTTP_PORT:-9000}/ >/dev/null 2>&1; then
              echo "本地探活通过（第 ${i} 次）"
              exit 0
            fi
            sleep 2
          done
          echo "::error::本地探活失败，输出容器日志"
          docker compose logs --tail 100
          exit 1

      - name: Verify public domain
        id: verify
        continue-on-error: true
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://cockpit.cuihairu.site/login || true)
          echo "https://cockpit.cuihairu.site/login → HTTP ${code}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"

      - name: Repair cloudflared origin
        if: steps.verify.outputs.code != '200'
        continue-on-error: true
        run: |
          set -euo pipefail
          # 源站已探活通过而公网 502 → tunnel 回源问题。cloudflared 为
          # token 模式（ingress 在 CF 控制台远程管理），bridge 网络下
          # service: http://localhost:9000 指向容器自身，恒 502——以
          # host 网络重建即可，token 原样迁移，tunnel 身份与控制台配置不变
          mode=$(docker inspect cloudflared --format '{{.HostConfig.NetworkMode}}' 2>/dev/null || echo "missing")
          echo "cloudflared 网络模式: ${mode}"
          echo '--- cloudflared 日志尾部（回源错误与地址可见，token 已脱敏） ---'
          docker logs cloudflared --tail 60 2>&1 \
            | sed 's/eyJ[A-Za-z0-9._-]*/eyJ***REDACTED***/g' || true
          if [ "$mode" = "host" ]; then
            echo '--- 本机 IP（核对 CF 控制台 service 指向的 192.168.5.188 是否本机） ---'
            ip -4 addr show 2>/dev/null | grep -E 'inet ' || true
            echo '--- 本机直连探测（区分"指错机器"与"端口未通"） ---'
            curl -s -o /dev/null -w '127.0.0.1:9090 → %{http_code}\n' -m 3 http://127.0.0.1:9090/ || echo '127.0.0.1:9090 不通'
            curl -s -o /dev/null -w '127.0.0.1:9000 → %{http_code}\n' -m 3 http://127.0.0.1:9000/ || echo '127.0.0.1:9000 不通'
            curl -s -o /dev/null -w '192.168.5.188:9090 → %{http_code}\n' -m 3 http://192.168.5.188:9090/ || echo '192.168.5.188:9090 不通（该 IP 非本机或被拒）'
            echo '已是 host 网络：请到 CF Zero Trust 控制台核对该 Public Hostname 的 service 应为 http://localhost:9000'
            exit 0
          fi
          token=$(docker inspect cloudflared --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null \
            | grep '^TUNNEL_TOKEN=' | cut -d= -f2-)
          if [ -z "$token" ]; then
            echo '::warning::cloudflared 非 host 网络且无 TUNNEL_TOKEN，无法自动重建——请人工检查'
            exit 0
          fi
          image=$(docker inspect cloudflared --format '{{.Config.Image}}')
          echo "以 host 网络重建 cloudflared（镜像 ${image}，tunnel 身份不变）..."
          docker rm -f cloudflared
          docker run -d --name cloudflared --restart unless-stopped --network host \
            -e TUNNEL_TOKEN="$token" "$image" tunnel --no-autoupdate run
          sleep 12
          docker ps --filter name=cloudflared --format 'table {{.Names}}\t{{.Status}}'
          code=$(curl -s -o /dev/null -w '%{http_code}' -m 20 https://cockpit.cuihairu.site/login || true)
          echo "重建后 https://cockpit.cuihairu.site/login → HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo '::warning::host 网络重建后仍非 200——CF 控制台 Public Hostname 的 service 配置请人工核对（应为 http://localhost:9000），诊断日志见上'
          fi

      - name: Status
        run: |
          set -euo pipefail
          docker compose ps
          docker image ls cockpit:local --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}'
          echo "部署完成：$(date -Is)"
