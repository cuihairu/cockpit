# Cockpit 配置文件

# 服务器配置
server:
  host: "0.0.0.0"  # 监听所有接口，支持局域网和 Cloudflare Tunnel 访问
  port: 9090

# 数据库配置
database:
  path: "./data/cockpit.db"

# Inventory 配置
inventory:
  path: "./examples/inventory.yaml"
  watch: false
  # true 时 inventory 路径缺失、解析失败或初始同步失败会阻止 Server 启动
  strict: false

# JWT 认证配置
jwt:
  secret: "your-secret-key-change-this"
  expiration: 24h

# 邮件配置（用于密码重置）
email:
  enabled: false  # 默认关闭，需要时启用
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "${SMTP_USER}"      # 从环境变量读取
    password: "${SMTP_PASS}"      # 从环境变量读取
    from: "noreply@example.com"
    from_name: "Cockpit"
  base_url: "http://localhost:9000"

# 通知配置（Herald / ntfy / webhook / Telegram，均可多个、可并存）
notification:
  enabled: false  # 默认关闭，配置任一渠道后启用
  herald:
    base_url: "http://localhost:8080"
    timeout: 5s
  # ntfy 渠道（可配多个）
  # ntfy:
  #   - server: "https://ntfy.sh"
  #     topic: "cockpit-alerts"
  #     token: ""        # 可选，私有主题鉴权
  #     priority: ""     # 可选 min/low/default/high/urgent，空则按告警级别推导
  #     timeout: 5s
  # webhook 渠道（可配多个；secret 作为 X-Cockpit-Secret 头供接收方鉴权）
  # webhook:
  #   - url: "https://example.com/cockpit-hook"
  #     secret: ""
  #     timeout: 5s
  # Telegram 渠道（可配多个）
  # telegram:
  #   - bot_token: ""
  #     chat_id: ""
  #     timeout: 5s
  # 事件类型映射
  events:
    certificate_expired:
      type: "certificate.expired"
      enabled: true
    certificate_expiring:
      type: "certificate.expiring"
      enabled: true
    certificate_warning:
      type: "certificate.warning"
      enabled: true
    service_down:
      type: "service.down"
      enabled: true
    agent_offline:
      type: "agent.offline"
      enabled: true
    domain_expired:
      type: "domain.expired"
      enabled: true

# Agent 配置
agent:
  api_key_header: "X-API-Key"

# 远程控制目标白名单
remote_control:
  allow_arbitrary_target: false
  # 默认只允许显式列出的主机、IP 或 CIDR；开发环境如需任意目标可改为 true
  allowed_targets: []
  # 可选：按 Agent 进一步限制出口目标和端口
  # egress:
  #   - agent_id: "office-agent"
  #     allowed_targets:
  #       - "192.168.10.0/24"
  #       - "db.internal"
  #     allowed_ports:
  #       - 22
  #       - 3389

# DNS 管理（/dns 页面记录管理、DDNS；凭据同时服务 ACME DNS-01 签发）
# 各厂商凭据建议用环境变量注入（优先于配置文件）：
#   CLOUDFLARE_API_TOKEN / DNSPOD_LOGIN_TOKEN / ALIYUN_ACCESS_KEY(+_SECRET)
dns:
  # ACME DNS-01 provider：空 = cloudflare（向后兼容）/ dnspod / alidns
  # provider: ""
  cloudflare:
    api_token: ""
  # DNSPod 凭据（"ID,Token" 合并格式）
  # dnspod:
  #   login_token: ""
  # 阿里云 AccessKey
  # alidns:
  #   access_key: ""
  #   secret_key: ""

# 组网云管理面（/network 页面云端视图；运行态观测在 agent，管理凭据由 server 直连云 API）
# token 建议用环境变量 ZEROTIER_API_TOKEN / TAILSCALE_API_TOKEN 注入（优先于配置文件）
# overlay:
#   zerotier:
#     api_token: ""
#   tailscale:
#     api_token: ""
#     tailnet: ""  # 空 = "-"，即 token 所属默认 tailnet

