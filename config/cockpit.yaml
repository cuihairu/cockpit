# Cockpit 配置文件

# 服务器配置
server:
  host: "0.0.0.0"  # 监听所有接口，支持局域网和 Cloudflare Tunnel 访问
  port: 9090

# 数据库配置
database:
  path: "./data/cockpit.db"

# Inventory 配置
inventory:
  path: "./examples/inventory.yaml"
  watch: false
  # true 时 inventory 路径缺失、解析失败或初始同步失败会阻止 Server 启动
  strict: false

# JWT 认证配置
jwt:
  secret: "your-secret-key-change-this"
  expiration: 24h

# 邮件配置（用于密码重置）
email:
  enabled: false  # 默认关闭，需要时启用
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: "${SMTP_USER}"      # 从环境变量读取
    password: "${SMTP_PASS}"      # 从环境变量读取
    from: "noreply@example.com"
    from_name: "Cockpit"
  base_url: "http://localhost:9000"

# 通知配置（Herald 集成）
notification:
  enabled: false  # 默认关闭，需要 Herald 服务时启用
  herald:
    base_url: "http://localhost:8080"
    timeout: 5s
  # 事件类型映射
  events:
    certificate_expired:
      type: "certificate.expired"
      enabled: true
    certificate_expiring:
      type: "certificate.expiring"
      enabled: true
    certificate_warning:
      type: "certificate.warning"
      enabled: true
    service_down:
      type: "service.down"
      enabled: true
    agent_offline:
      type: "agent.offline"
      enabled: true
    domain_expired:
      type: "domain.expired"
      enabled: true

# Agent 配置
agent:
  api_key_header: "X-API-Key"

# 远程控制目标白名单
remote_control:
  allow_arbitrary_target: false
  # 默认只允许显式列出的主机、IP 或 CIDR；开发环境如需任意目标可改为 true
  allowed_targets: []
  # 可选：按 Agent 进一步限制出口目标和端口
  # egress:
  #   - agent_id: "office-agent"
  #     allowed_targets:
  #       - "192.168.10.0/24"
  #       - "db.internal"
  #     allowed_ports:
  #       - 22
  #       - 3389
