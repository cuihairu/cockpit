<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1500" viewBox="0 0 1280 1500" role="img" aria-labelledby="title desc" xml:lang="zh-CN">
<title id="title">Cockpit · 运行时架构</title>
<desc id="desc">三个运行时平面。浏览器 Web UI（React 19 + Ant Design + xterm.js + guacamole-common-js）与移动端、CLI 只与 Cockpit Server 通信。Server（cmd/cockpit）是中央控制平面：HTTP JSON API / WebSocket、静态资源、SQLite（GORM）持久化、内存 Agent 注册表、认证/审计/告警/反代/远程会话编排，模块含 auth、audit、alert（Herald/ntfy/webhook/Telegram）、proxy、storage、inventory/sync、jobs/stacks/cron。Cockpit Agent（cmd/cockpit-agent）是节点执行平面：能力检测、30 秒心跳与系统指标、RPC/代理/远程桌面，主动拨出 WSS（NAT 友好）注册，连接本地或可达目标（主机/systemd、Docker、PVE、OpenWrt、SSH/RDP/VNC）。Web UI 从不直连 Agent 或内网目标。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.plane{font-size:19px;font-weight:700;fill:#334155}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
<rect width="1280" height="1500" rx="20" fill="#f8fafc"/>
<text x="40" y="48" class="title" text-anchor="start">Cockpit · 运行时架构</text>
<text x="40" y="80" class="body" text-anchor="start">三个运行时平面：Web UI 只与 Server 通信 · Server 为中央控制平面 · Agent 节点执行平面 · 受管目标在节点本地/可达侧</text>

