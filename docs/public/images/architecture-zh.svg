<path d="M640 770 V825 H985 V880" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="server-agent-right" data-from="server" data-to="agent-right" d="M640 770 V825 H985 V880" class="edge" style="stroke:#c2410c;stroke-width:2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M245 1030 V1180" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="agent-target-left" data-from="agent-left" data-to="targets" d="M245 1030 V1180" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M615 1030 V1180" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="agent-target-mid" data-from="agent-mid" data-to="targets" d="M615 1030 V1180" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>
<path d="M985 1030 V1180" fill="none" stroke="#f8fafc" stroke-width="9"/>
<path id="agent-target-right" data-from="agent-right" data-to="targets" d="M985 1030 V1180" class="edge" style="stroke:#475569;stroke-width:2" marker-end="url(#arrow)"/>

<g id="web-ui" data-node="web-ui"><rect x="80" y="130" width="520" height="120" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="102" y="164" class="name" text-anchor="start">浏览器 Web UI · web/</text>
<text x="102" y="193" class="body" text-anchor="start">React 19 + Ant Design · xterm.js · guacamole-common-js 1.5</text>
<text x="102" y="220" class="small" text-anchor="start">登录 · 资源视图 · 工作台 · 监控 · 设置 · 远程连接 · 只经 /api 与 Server 通信</text></g>
<g id="cli" data-node="cli"><rect x="680" y="130" width="520" height="120" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="702" y="164" class="name" text-anchor="start">CLI · mobile（Flutter）</text>
<text x="702" y="193" class="body" text-anchor="start">cockpit init / sync / status / server / agent</text>
<text x="702" y="220" class="small" text-anchor="start">本地初始化 · 清单同步 · 状态查询 · 启动 Server · 移动端走同一 API</text></g>

<g id="server" data-node="server"><rect x="80" y="360" width="1120" height="410" rx="14" fill="#eef2ff" stroke="#a5b4fc" stroke-width="1.5"/>
<text x="105" y="396" class="name" text-anchor="start">Cockpit Server · cmd/cockpit · 中央控制平面</text>
<text x="105" y="422" class="body" text-anchor="start">HTTP JSON API / WebSocket · 静态资源 · SQLite（GORM）持久化 · 内存 Agent 注册表 · 认证/审计/告警/反代/远程会话编排</text></g>
<g id="srv-auth" data-node="srv-auth"><rect x="105" y="445" width="250" height="135" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
