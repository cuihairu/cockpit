<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1500" viewBox="0 0 1280 1500" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">Cockpit · Runtime Architecture</title>
<desc id="desc">Three runtime planes. The browser Web UI (React 19 + Ant Design + xterm.js + guacamole-common-js), mobile app and CLI talk only to the Cockpit Server. The Server (cmd/cockpit) is the central control plane: HTTP JSON API / WebSocket, static assets, SQLite (GORM) persistence, in-memory Agent registry, authentication/auditing/alerting/reverse proxy/remote session orchestration; modules include auth, audit, alert (Herald/ntfy/webhook/Telegram), proxy, storage, inventory/sync, jobs/stacks/cron. The Cockpit Agent (cmd/cockpit-agent) is the node execution plane: capability detection, 30s heartbeat and system metrics, RPC/proxy/remote desktop, dials out over WSS (NAT-friendly) to register, and connects to local or reachable targets (host/systemd, Docker, PVE, OpenWrt, SSH/RDP/VNC). The Web UI never connects directly to Agents or intranet targets.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font-family:Arial,'Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#172b4d}.title{font-size:30px;font-weight:700}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#435570}.small{font-size:14px;fill:#52647b}.plane{font-size:19px;font-weight:700;fill:#334155}.label{font-size:15px;fill:#435570;paint-order:stroke;stroke:#f8fafc;stroke-width:5px;stroke-linejoin:round}.edge{fill:none;stroke-linejoin:round}.control{stroke-dasharray:7 5}</style>
