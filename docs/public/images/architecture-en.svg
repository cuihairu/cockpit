<text x="785" y="1246" class="body" text-anchor="start">routers · egress</text>
<text x="785" y="1268" class="small" text-anchor="start">ipk package · OOB bootstrap</text></g>
<g id="t-remote" data-node="t-remote"><rect x="985" y="1190" width="200" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="1005" y="1222" class="name" text-anchor="start">SSH / RDP / VNC</text>
<text x="1005" y="1246" class="body" text-anchor="start">terminal · desktop</text>
<text x="1005" y="1268" class="small" text-anchor="start">guacd relay · session recording</text></g>

<text x="355" y="300" class="label" text-anchor="start" style="fill:#2563eb">HTTP JSON API / WebSocket (/api)</text>
<text x="955" y="300" class="label" text-anchor="start" style="fill:#2563eb">same API (CLI / mobile)</text>
<text x="650" y="845" class="label" text-anchor="start" style="fill:#c2410c">WSS /ws bidirectional: register · heartbeat · rpc_request/response · proxy_* · probe_report · exec_log</text>
<text x="70" y="1080" class="label" text-anchor="start">local API / socket / TCP → target</text>
<text x="40" y="1340" class="small" text-anchor="start">Protocol boundary: Server–Agent unified message {id, type, timestamp, payload}; register must be the first message, RPC correlates by message ID, proxy correlates by proxyId/connId.</text>
<text x="40" y="1365" class="small" text-anchor="start">Data boundary: Inventory YAML is declarative asset input · SQLite is the API/UI runtime query plane · heartbeats update online status and metrics · Agents never write the Server database directly.</text>
<text x="40" y="1390" class="small" text-anchor="start">Security boundary: registration is fail-closed by default (enrollment_secret) · ADMIN_PASSWORD ≥ 8 chars · production needs PRODUCTION=true + TOTP_ENCRYPTION_KEY · remote tickets 5-min single-use · allowed_targets allowlist.</text>
<text x="40" y="1415" class="small" text-anchor="start">Foundations: Go + GORM/SQLite · gorilla/websocket · React 19 + Ant Design · Apache Guacamole (guacd + guacamole-common-js 1.5) · go-acme/lego DNS-01 · Flutter mobile · Inno Setup installer.</text>
<text x="40" y="1440" class="small" text-anchor="start">Notes: the Web UI never connects directly to Agents or intranet targets · Agents do not handle user auth or global state · cross-module calls respect boundaries (API handlers query through storage, not parse inventory directly).</text>
</svg>
