<text x="842" y="942" class="body" text-anchor="start">capability detection · 30s heartbeat · system metrics</text>
<text x="842" y="968" class="body" text-anchor="start">RPC / proxy / remote desktop · target connection</text>
<text x="842" y="994" class="small" text-anchor="start">Providers registered conditionally by capability / env vars</text></g>

<g id="targets" data-node="targets"><rect x="80" y="1130" width="1120" height="160" rx="14" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="8 6"/>
<text x="105" y="1163" class="plane" text-anchor="start">Managed targets (node-local / reachable)</text></g>
<g id="t-host" data-node="t-host"><rect x="105" y="1190" width="200" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
