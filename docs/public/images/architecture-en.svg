<text x="102" y="942" class="body" text-anchor="start">capability detection · 30s heartbeat · system metrics</text>
<text x="102" y="968" class="body" text-anchor="start">RPC / proxy / remote desktop · target connection</text>
<text x="102" y="994" class="small" text-anchor="start">dials out over WSS · nodes behind NAT need no inbound port</text></g>
