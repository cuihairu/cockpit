<text x="472" y="942" class="body" text-anchor="start">capability detection · 30s heartbeat · system metrics</text>
<text x="472" y="968" class="body" text-anchor="start">RPC / proxy / remote desktop · target connection</text>
<text x="472" y="994" class="small" text-anchor="start">first message is register · duplicate connection check · secret check</text></g>
