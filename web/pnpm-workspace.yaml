# pnpm 11 起 minimumReleaseAge 默认启用（拒收冷却期内发布的新包版本），dependabot
# 升级刚发布的包时会撞 `pnpm install --frozen-lockfile`（Docker 腿曾因此红）。
# 本仓版本已由 lockfile 钉死、更新走 dependabot 审核，冷却期无增量收益，显式关闭。
minimumReleaseAge: 0
overrides:
  path-to-regexp: ^8.4.0
  brace-expansion: ^5.0.9
  browserslist: ^4.28.9
  postcss: ^8.5.28
  '@babel/core': ^7.29.6
  follow-redirects@<1.16.1: 1.16.1
  '@vitest/mocker@<5.0.3': 5.0.3
  # jsdom 31 的 parse5-parser-stream 8.1.0 声明 parse5 ^8.0.1 却调用 8.1 才有的
  # tokenizer.flushCharacters（semver 兼容但 API 不兼容），jsdom 环境起不来、
  # 102 个测试文件全红；8.1.1 修依赖为 parse5 ^8.1.1，强制走修复版
  parse5-parser-stream: ^8.1.1
